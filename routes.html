<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TransitFlow — Transit Map</title>

    <!-- Main CSS -->
    <link rel="stylesheet" href="main.css">

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #07100d;
            color: #f3f7f5;
            font-family: Arial, sans-serif;
        }

        .map-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* NAVBAR */

        .topbar {
            height: 72px;
            padding: 0 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            background: rgba(7,16,13,0.95);
            position: relative;
            z-index: 1000;
        }

        .brand {
            font-size: 22px;
            font-weight: 700;
            color: #dfff5f;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .nav-links a {
            color: #aebbb5;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #dfff5f;
        }

        /* PAGE */

        .map-layout {
            flex: 1;
            display: grid;
            grid-template-columns: 350px 1fr;
            min-height: calc(100vh - 72px);
        }

        /* SIDEBAR */

        .sidebar {
            background: #0b1512;
            border-right: 1px solid rgba(255,255,255,0.08);
            padding: 25px;
            overflow-y: auto;
        }

        .sidebar h1 {
            margin: 0 0 8px;
            font-size: 25px;
        }

        .sidebar-subtitle {
            color: #8e9b95;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .source-badge {
            display: inline-block;
            padding: 7px 10px;
            border-radius: 20px;
            background: rgba(223,255,95,0.08);
            color: #dfff5f;
            border: 1px solid rgba(223,255,95,0.2);
            font-size: 11px;
            margin-bottom: 20px;
        }

        .route-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .route-card {
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.08);
            background: #101c18;
            cursor: pointer;
            transition: 0.2s;
        }

        .route-card:hover {
            border-color: rgba(223,255,95,0.4);
            transform: translateY(-1px);
        }

        .route-card.active {
            border-color: #dfff5f;
            background: rgba(223,255,95,0.07);
        }

        .route-number {
            color: #dfff5f;
            font-size: 17px;
            font-weight: 700;
        }

        .route-name {
            margin-top: 5px;
            color: #d4ddd8;
            font-size: 13px;
        }

        .route-stops {
            margin-top: 8px;
            color: #788780;
            font-size: 11px;
        }

        /* MAP */

        .map-container {
            position: relative;
            min-height: calc(100vh - 72px);
            background: #d9d9d9;
        }

        #map {
            width: 100%;
            height: 100%;
            min-height: calc(100vh - 72px);
        }

        /* DETAILS */

        .map-info {
            position: absolute;
            left: 20px;
            bottom: 20px;
            width: 330px;
            padding: 18px;
            border-radius: 15px;
            background: rgba(8,16,13,0.93);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            z-index: 500;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .map-info-title {
            color: #dfff5f;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .map-info-text {
            color: #aebbb5;
            font-size: 12px;
            line-height: 1.6;
        }

        /* STOP MARKER */

        .stop-marker {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #dfff5f;
            color: #07100d;
            border: 3px solid #07100d;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 800;
            box-shadow: 0 3px 12px rgba(0,0,0,0.45);
        }

        /* MOBILE */

        @media (max-width: 800px) {

            .topbar {
                padding: 0 16px;
            }

            .nav-links {
                display: none;
            }

            .map-layout {
                grid-template-columns: 1fr;
            }

            .sidebar {
                max-height: 360px;
                border-right: none;
                border-bottom: 1px solid rgba(255,255,255,0.08);
            }

            .map-container {
                min-height: 600px;
            }

            #map {
                min-height: 600px;
            }

            .map-info {
                width: calc(100% - 30px);
                left: 15px;
                bottom: 15px;
            }
        }
    </style>
</head>

<body>

<div class="map-page">

    <!-- NAVBAR -->

    <header class="topbar">

        <a href="index.html" class="brand">
            TransitFlow
        </a>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="dashboard.html">Intelligence</a>
            <a href="routes.html" class="active">Transit Map</a>
            <a href="forecasting.html">Forecast</a>
            <a href="index.html#planner">Plan Journey</a>
        </nav>

    </header>


    <!-- MAIN -->

    <main class="map-layout">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <h1>CTU Network</h1>

            <div class="sidebar-subtitle">
                Explore Chandigarh Transport Undertaking routes
                and available stops.
            </div>

            <div class="source-badge">
                OFFICIAL CTU ROUTE INFORMATION
            </div>

            <div id="routeList" class="route-list">

                <div class="route-card">
                    Loading routes...
                </div>

            </div>

        </aside>


        <!-- MAP -->

        <section class="map-container">

            <div id="map"></div>

            <div class="map-info">

                <div id="mapInfoTitle" class="map-info-title">
                    Select a route
                </div>

                <div id="mapInfoText" class="map-info-text">
                    Choose a route from the left panel to view
                    its available stops on the map.
                </div>

            </div>

        </section>

    </main>

</div>


<!-- Leaflet JS -->

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

    /* ================================
       MAP INITIALIZATION
    ================================= */

    const map = L.map("map", {
        center: [30.7412, 76.7827],
        zoom: 12,
        zoomControl: true,
        scrollWheelZoom: true,
        doubleClickZoom: true,
        dragging: true
    });


    /* ================================
       OPENSTREETMAP
    ================================= */

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,
            attribution:
                '&copy; OpenStreetMap contributors'
        }
    ).addTo(map);


    /* ================================
       GLOBAL VARIABLES
    ================================= */

    let routesData = [];
    let stopsData = {};

    let currentMarkers = [];
    let currentLine = null;


    /* ================================
       CUSTOM STOP ICON
    ================================= */

    function createStopIcon(number) {

        return L.divIcon({

            className: "",

            html: `
                <div class="stop-marker">
                    ${number}
                </div>
            `,

            iconSize: [30, 30],

            iconAnchor: [15, 15],

            popupAnchor: [0, -15]
        });

    }


    /* ================================
       NORMALIZE TEXT
    ================================= */

    function normalize(value) {

        return String(value || "")
            .toLowerCase()
            .replace(/[^a-z0-9]/g, "");

    }


    /* ================================
       FIND STOP
    ================================= */

    function findStop(stopName) {

        if (!stopName) {
            return null;
        }

        /* Direct key */

        if (stopsData[stopName]) {
            return stopsData[stopName];
        }


        /* Normalized key */

        const target = normalize(stopName);

        for (const key in stopsData) {

            if (normalize(key) === target) {
                return stopsData[key];
            }

        }


        /* Name matching */

        for (const key in stopsData) {

            const stop = stopsData[key];

            if (
                stop &&
                normalize(stop.name) === target
            ) {
                return stop;
            }

        }


        return null;
    }


    /* ================================
       CLEAR MAP
    ================================= */

    function clearRouteFromMap() {

        currentMarkers.forEach(marker => {

            map.removeLayer(marker);

        });

        currentMarkers = [];


        if (currentLine) {

            map.removeLayer(currentLine);

            currentLine = null;

        }

    }


    /* ================================
       SHOW ROUTE
    ================================= */

    function showRoute(route) {

        clearRouteFromMap();


        const routePoints = [];

        let mappedCount = 0;
        let missingCount = 0;


        /* ================================
           LOOP THROUGH ROUTE STOPS
        ================================= */

        route.stops.forEach((stopName, index) => {

            const stop = findStop(stopName);


            if (!stop) {

                missingCount++;

                return;

            }


            if (
                typeof stop.lat !== "number" ||
                typeof stop.lng !== "number"
            ) {

                missingCount++;

                return;

            }


            const point = [
                stop.lat,
                stop.lng
            ];

            routePoints.push(point);

            mappedCount++;


            /* ================================
               MARKER
            ================================= */

            const marker = L.marker(
                point,
                {
                    icon: createStopIcon(index + 1)
                }
            ).addTo(map);


            marker.bindPopup(`
                <div style="min-width:160px">

                    <strong>
                        ${stop.name || stopName}
                    </strong>

                    <br>

                    <span style="font-size:12px;color:#666">
                        Route ${route.route_number || route.number || ""}
                    </span>

                </div>
            `);


            currentMarkers.push(marker);

        });


        /* ================================
           DRAW ROUTE LINE
        ================================= */

        if (routePoints.length > 1) {

            currentLine = L.polyline(
                routePoints,
                {
                    color: "#8faa25",
                    weight: 5,
                    opacity: 0.85,
                    dashArray: "10 8"
                }
            ).addTo(map);

        }


        /* ================================
           AUTO ZOOM
        ================================= */

        if (routePoints.length > 1) {

            const bounds =
                L.latLngBounds(routePoints);


            map.fitBounds(
                bounds,
                {
                    paddingTopLeft: [50, 50],
                    paddingBottomRight: [50, 50],
                    maxZoom: 15,
                    animate: true
                }
            );

        }

        else if (routePoints.length === 1) {

            map.setView(
                routePoints[0],
                15,
                {
                    animate: true
                }
            );

        }


        /* ================================
           INFO PANEL
        ================================= */

        const routeNumber =
            route.route_number ||
            route.number ||
            route.route ||
            "Route";


        const routeName =
            route.name ||
            route.route_name ||
            "";


        document.getElementById("mapInfoTitle").textContent =
            `${routeNumber} ${routeName}`;


        document.getElementById("mapInfoText").innerHTML = `
            <strong>${mappedCount}</strong> stops mapped
            ${
                missingCount > 0
                ? ` · ${missingCount} stops unavailable`
                : ""
            }
            <br><br>
            Click any numbered stop to view its details.
        `;

    }


    /* ================================
       CREATE ROUTE CARD
    ================================= */

    function createRouteCard(route) {

        const card =
            document.createElement("div");

        card.className = "route-card";


        const routeNumber =
            route.route_number ||
            route.number ||
            route.route ||
            "Route";


        const routeName =
            route.name ||
            route.route_name ||
            "CTU Service";


        const stops =
            Array.isArray(route.stops)
            ? route.stops.length
            : 0;


        card.innerHTML = `

            <div class="route-number">
                ${routeNumber}
            </div>

            <div class="route-name">
                ${routeName}
            </div>

            <div class="route-stops">
                ${stops} stops
            </div>

        `;


        card.addEventListener(
            "click",
            function () {

                document
                    .querySelectorAll(".route-card")
                    .forEach(item => {

                        item.classList.remove("active");

                    });


                card.classList.add("active");


                showRoute(route);


                /* Fix Leaflet rendering */

                setTimeout(() => {

                    map.invalidateSize();

                }, 250);

            }
        );


        return card;

    }


    /* ================================
       LOAD DATA
    ================================= */

    Promise.all([

        fetch("routes.json")
            .then(response => {

                if (!response.ok) {
                    throw new Error(
                        "routes.json could not be loaded"
                    );
                }

                return response.json();

            }),


        fetch("stops.json")
            .then(response => {

                if (!response.ok) {
                    throw new Error(
                        "stops.json could not be loaded"
                    );
                }

                return response.json();

            })

    ])

    .then(([routes, stops]) => {


        /* ================================
           ROUTES
        ================================= */

        if (Array.isArray(routes)) {

            routesData = routes;

        }

        else if (Array.isArray(routes.routes)) {

            routesData = routes.routes;

        }

        else {

            routesData = [];

        }


        /* ================================
           STOPS
        ================================= */

        if (stops.stops) {

            stopsData = stops.stops;

        }

        else {

            stopsData = stops;

        }


        /* ================================
           ROUTE LIST
        ================================= */

        const routeList =
            document.getElementById("routeList");


        routeList.innerHTML = "";


        if (routesData.length === 0) {

            routeList.innerHTML = `
                <div class="route-card">
                    No routes found.
                </div>
            `;

            return;

        }


        routesData.forEach(route => {

            routeList.appendChild(
                createRouteCard(route)
            );

        });


        /* ================================
           INITIAL MAP SIZE FIX
        ================================= */

        setTimeout(() => {

            map.invalidateSize();

        }, 500);

    })


    .catch(error => {

        console.error(error);


        document.getElementById("routeList")
            .innerHTML = `

                <div class="route-card">

                    <div class="route-number">
                        Data Error
                    </div>

                    <div class="route-name">
                        ${error.message}
                    </div>

                </div>

            `;

    });


    /* ================================
       WINDOW RESIZE
    ================================= */

    window.addEventListener(
        "resize",
        () => {

            setTimeout(() => {

                map.invalidateSize();

            }, 200);

        }
    );

</script>

</body>
</html>
