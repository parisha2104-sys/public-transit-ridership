<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TransitFlow — CTU Routes</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <link rel="stylesheet" href="main.css">

    <style>
        body {
            margin: 0;
            background: #07100d;
            color: #f5f7f6;
            font-family: Arial, sans-serif;
        }

        .routes-page {
            display: grid;
            grid-template-columns: 340px 1fr;
            height: calc(100vh - 72px);
        }

        .route-sidebar {
            background: #0b1512;
            border-right: 1px solid rgba(255,255,255,0.08);
            padding: 24px;
            overflow-y: auto;
        }

        .route-sidebar h2 {
            margin-top: 0;
            font-size: 24px;
        }

        .route-sidebar p {
            color: #91a09a;
            font-size: 14px;
            line-height: 1.5;
        }

        .source-badge {
            display: inline-block;
            margin: 12px 0 20px;
            padding: 7px 10px;
            border-radius: 20px;
            background: rgba(169,255,92,0.10);
            color: #a9ff5c;
            font-size: 12px;
        }

        .route-card {
            padding: 17px;
            margin-bottom: 12px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            background: #101c18;
            cursor: pointer;
            transition: 0.2s;
        }

        .route-card:hover,
        .route-card.active {
            border-color: #a9ff5c;
            transform: translateY(-2px);
        }

        .route-number {
            font-size: 22px;
            font-weight: bold;
            color: #a9ff5c;
        }

        .route-name {
            margin-top: 6px;
            font-size: 14px;
        }

        .route-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 14px;
        }

        .meta-box {
            background: #07100d;
            padding: 9px;
            border-radius: 8px;
        }

        .meta-label {
            display: block;
            color: #73817b;
            font-size: 10px;
            text-transform: uppercase;
        }

        .meta-value {
            display: block;
            margin-top: 3px;
            font-size: 13px;
        }

        #map {
            width: 100%;
            height: 100%;
            background: #111;
        }

        .route-details {
            position: absolute;
            z-index: 1000;
            right: 25px;
            bottom: 25px;
            width: 330px;
            padding: 20px;
            background: rgba(8,17,14,0.94);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 16px;
            backdrop-filter: blur(12px);
        }

        .route-details h3 {
            margin: 0 0 8px;
            color: #a9ff5c;
        }

        .route-details p {
            margin: 7px 0;
            color: #b7c1bc;
            font-size: 13px;
        }

        .stop-list {
            margin-top: 14px;
            max-height: 180px;
            overflow-y: auto;
        }

        .stop {
            padding: 7px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 12px;
            color: #dce4df;
        }

        .stop::before {
            content: "●";
            color: #a9ff5c;
            margin-right: 8px;
        }

        .leaflet-popup-content-wrapper,
        .leaflet-popup-tip {
            background: #101c18;
            color: white;
        }

        .leaflet-control-attribution {
            background: rgba(0,0,0,0.7) !important;
            color: #aaa;
        }

        @media (max-width: 850px) {
            .routes-page {
                grid-template-columns: 1fr;
                grid-template-rows: 380px 1fr;
            }

            .route-sidebar {
                order: 2;
            }

            #map {
                order: 1;
            }

            .route-details {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo">TransitFlow</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="dashboard.html">Intelligence</a>
            <a href="routes.html">Transit Map</a>
            <a href="forecasting.html">Forecast</a>
            <a href="index.html#planner">Plan Journey</a>
        </div>
    </nav>


    <!-- ROUTES + MAP -->
    <main class="routes-page">

        <!-- SIDEBAR -->
        <aside class="route-sidebar">

            <h2>CTU Network</h2>

            <p>
                Chandigarh Transport Undertaking routes
                based on published CTU timetable information.
            </p>

            <span class="source-badge">
                ● OFFICIAL CTU DATA
            </span>

            <div id="routeList">
                Loading routes...
            </div>

        </aside>


        <!-- MAP -->
        <section style="position:relative;">

            <div id="map"></div>

            <div class="route-details" id="routeDetails">
                <h3>Select a route</h3>
                <p>
                    Choose a CTU route from the left panel
                    to view its published route information.
                </p>
            </div>

        </section>

    </main>


    <!-- LEAFLET -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <script>

        let map;
        let routeData = [];
        let activeRoute = null;

        let routeLayer = null;


        /*
        --------------------------------------------------
        INITIALIZE MAP
        --------------------------------------------------
        */

        map = L.map("map").setView(
            [30.7333, 76.7794],
            12
        );


        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }
        ).addTo(map);


        /*
        --------------------------------------------------
        LOAD REAL CTU JSON
        --------------------------------------------------
        */

        fetch("data/routes.json")

            .then(response => {

                if (!response.ok) {
                    throw new Error("routes.json not found");
                }

                return response.json();
            })

            .then(data => {

                routeData = data.routes;

                renderRoutes(routeData);

            })

            .catch(error => {

                console.error(error);

                document.getElementById("routeList").innerHTML = `
                    <div style="
                        color:#ff7b7b;
                        padding:15px;
                        background:#1c1111;
                        border-radius:10px;
                    ">
                        Unable to load CTU route data.
                        <br><br>
                        Check that:
                        <br>
                        <b>data/routes.json</b>
                        <br>
                        exists in your GitHub repository.
                    </div>
                `;

            });


        /*
        --------------------------------------------------
        CREATE ROUTE CARDS
        --------------------------------------------------
        */

        function renderRoutes(routes) {

            const container =
                document.getElementById("routeList");

            container.innerHTML = "";

            routes.forEach((route, index) => {

                const card =
                    document.createElement("div");

                card.className = "route-card";

                card.innerHTML = `

                    <div class="route-number">
                        ${route.route_id}
                    </div>

                    <div class="route-name">
                        ${route.origin}
                        →
                        ${route.destination}
                    </div>

                    <div class="route-meta">

                        <div class="meta-box">
                            <span class="meta-label">
                                Frequency
                            </span>

                            <span class="meta-value">
                                ${route.frequency_minutes} min
                            </span>
                        </div>

                        <div class="meta-box">
                            <span class="meta-label">
                                Distance
                            </span>

                            <span class="meta-value">
                                ${route.distance_km} km
                            </span>
                        </div>

                        <div class="meta-box">
                            <span class="meta-label">
                                Buses
                            </span>

                            <span class="meta-value">
                                ${route.buses}
                            </span>
                        </div>

                        <div class="meta-box">
                            <span class="meta-label">
                                Operator
                            </span>

                            <span class="meta-value">
                                ${route.operator}
                            </span>
                        </div>

                    </div>
                `;


                card.addEventListener(
                    "click",
                    () => selectRoute(route, card)
                );


                container.appendChild(card);

            });

        }


        /*
        --------------------------------------------------
        SELECT ROUTE
        --------------------------------------------------
        */

        function selectRoute(route, card) {

            activeRoute = route;

            document
                .querySelectorAll(".route-card")
                .forEach(el =>
                    el.classList.remove("active")
                );

            card.classList.add("active");


            showRouteDetails(route);

        }


        /*
        --------------------------------------------------
        ROUTE DETAILS
        --------------------------------------------------
        */

        function showRouteDetails(route) {

            const details =
                document.getElementById("routeDetails");

            details.innerHTML = `

                <h3>Route ${route.route_id}</h3>

                <p>
                    <strong>${route.origin}</strong>
                    →
                    <strong>${route.destination}</strong>
                </p>

                <p>
                    Frequency:
                    <strong>
                        ${route.frequency_minutes} minutes
                    </strong>
                </p>

                <p>
                    Distance:
                    <strong>
                        ${route.distance_km} km
                    </strong>
                </p>

                <p>
                    Fleet assigned:
                    <strong>
                        ${route.buses} buses
                    </strong>
                </p>

                <p>
                    Operator:
                    <strong>
                        ${route.operator}
                    </strong>
                </p>

                <div class="stop-list">

                    <strong style="
                        display:block;
                        margin-bottom:8px;
                    ">
                        Published route sequence
                    </strong>

                    ${route.stops.map(
                        stop => `
                            <div class="stop">
                                ${stop}
                            </div>
                        `
                    ).join("")}

                </div>
            `;

        }

    </script>

</body>
</html>
